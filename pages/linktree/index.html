<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPAMLab's Linktree</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/6bee25835f.js" crossorigin="anonymous"></script>
  <link rel="icon" href="./images/favicon.png" type="image/x-icon"/>
</head>
	
<body>
  <img src="./images/spamlab_avatar_196.png" alt="Profile Picture">

  <p id="userName">SPAMLab</p>
  <div id="description">Spatial Analysis And Modelling Lab <br>Institute of Astronomy, Geophysics and Atmospheric Sciences <br>Universidade de São Paulo </div>
    
  <main>
    <a href="https://spamlab.github.io/" target="_blank">
      <i class="fa-solid fa-laptop-code">&nbsp;</i> Website
    </a>
    <a href="https://www.instagram.com/spamlab.usp/" target="_blank">
      <i class="fab fa-instagram">&nbsp;</i> Instagram
    </a>
    <a href="https://www.youtube.com/@SPAMLabUSP/" target="_blank">
      <i class="fab fa-youtube">&nbsp;</i> YouTube
    </a>
    <a href="https://github.com/spamlab/" target="_blank">
      <i class="fab fa-github">&nbsp;</i> Github
    </a>
    <a href="https://www.iag.usp.br/" target="_blank">
      <i class="fa-solid fa-rocket">&nbsp;</i> IAG Website
    </a>
    <a href="http://www.usp.br/" target="_blank">
      <i class="fa-solid fa-globe">&nbsp;</i> USP Website
    </a>
  </main>
  
</body>
</html>
